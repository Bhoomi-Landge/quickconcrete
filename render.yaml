# Free Render web service — first open after idle may take ~30–60s to wake.
services:
  - type: web
    name: quickconcrete
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SERVE_FRONTEND
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@quickconcrete.local
      - key: ADMIN_PASSWORD
        value: admin123
