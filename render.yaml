# Free web + free Postgres (1 GB). Postgres free DB expires after 30 days — renew or upgrade for production.
services:
  - type: web
    name: quickconcrete
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SERVE_FRONTEND
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: quickconcrete-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@quickconcrete.local
      - key: ADMIN_PASSWORD
        value: admin123

databases:
  - name: quickconcrete-db
    plan: free
    databaseName: quickconcrete
    user: quickconcrete
